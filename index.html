<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Hábitos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>REGISTRADOR DE HÁBITOS</h1>
    </header>
    <main>
        <div id="dia-actual"></div>
        <button class="boton-accion" onclick="showAddUser()">Agregar usuario</button>
        <div id="addUserMenu" class="config-menu" style="display:none;">
            Nombre: <input type="text" id="nuevoUsuario">
            <button onclick="agregarUsuario()">Crear</button>
        </div>
        <div id="usuarios"></div>
        <div id="configMenu" class="config-menu" style="display:none;">
            <h3 id="configTitulo"></h3>
            <label>Inicio de semana:
                <select id="startDaySelect">
                    <option value="1">Lunes</option>
                    <option value="2">Martes</option>
                    <option value="3">Miércoles</option>
                    <option value="4">Jueves</option>
                    <option value="5">Viernes</option>
                    <option value="6">Sábado</option>
                    <option value="0">Domingo</option>
                </select>
            </label>
            <div>Hábito 1: <input type="number" id="objetivo1" min="1"></div>
            <div>Hábito 2: <input type="number" id="objetivo2" min="1"></div>
            <div>Hábito 3: <input type="number" id="objetivo3" min="1"></div>
            <div>Hábito 4: <input type="number" id="objetivo4" min="1"></div>
            <div>Hábito 5: <input type="number" id="objetivo5" min="1"></div>
            <div>Hábito 6: <input type="number" id="objetivo6" min="1"></div>
            <button onclick="guardarObjetivos()">Guardar</button>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Ludin Guerra</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
