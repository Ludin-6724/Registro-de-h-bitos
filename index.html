<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Hábitos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Registro de Hábitos</h1>
        <div class="header-right">
            <span id="today"></span>
            <button id="addUserBtn">Agregar usuario</button>
        </div>
    </header>

    <div id="userForm" class="modal hidden">
        <h2>Nuevo usuario</h2>
        <input type="text" id="userName" placeholder="Nombre del usuario">
        <button id="createUserBtn">Crear</button>
    </div>

    <div id="habitForm" class="modal hidden">
        <h2>Nuevo hábito</h2>
        <input type="text" id="habitName" placeholder="Nombre del hábito">
        <input type="number" id="habitGoal" min="1" value="7" placeholder="Objetivo semanal">
        <button id="saveHabitBtn">Guardar</button>
    </div>

    <div id="journalModal" class="modal hidden fullscreen dark">
        <div id="journalContent">
            <textarea id="journalText" placeholder="Escribe tu nota..."></textarea>
            <input type="text" id="journalPhrase" placeholder="En una frase lo que Dios me está hablando">
            <button id="deletePhraseBtn">Borrar frase</button>
            <ul id="checkList"></ul>
            <button id="addCheckBtn">Agregar tarea</button>
            <div class="journal-actions">
                <button id="downloadNoteBtn">Guardar nota</button>
                <button id="closeJournalBtn">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="layout">
        <div id="users"></div>
        <aside id="competition">
            <h2>Competencia semanal</h2>
            <div id="scoreboard"></div>
            <div id="miniCalendar"></div>
            <div id="taskBox">
                <h3>Tareas semanales</h3>
                <ul id="weeklyTasks"></ul>
            </div>
            <div id="phraseBox">
                <h3>Frases</h3>
                <ul id="phraseList"></ul>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
